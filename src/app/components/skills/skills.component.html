<div class="skills">
  <h2 data-aos="fade-up">My Skills</h2>
  
  <div class="marquee-container" data-aos="fade-in" data-aos-delay="200" *ngIf="skills.length > 0">
    <div class="marquee-track">
      <!-- First Group -->
      <div class="marquee-group">
        <div class="skill-item" *ngFor="let skill of skills">
          <img [src]="skill.image_url" [alt]="skill.name + ' Logo'" />
          <h3>{{ skill.name }}</h3>
        </div>
      </div>

      <!-- Second Group (Duplicated for Infinite Loop) -->
      <div class="marquee-group">
        <div class="skill-item" *ngFor="let skill of skills">
          <img [src]="skill.image_url" [alt]="skill.name + ' Logo'" />
          <h3>{{ skill.name }}</h3>
        </div>
      </div>
    </div>
  </div>
</div>
