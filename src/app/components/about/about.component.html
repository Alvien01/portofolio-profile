<div class="about" *ngIf="profile">
  <h2 data-aos="fade-up">About Me</h2>
  <div class="about-content">
    <div class="image-wrapper" data-aos="fade-right">
      <div class="image-border"></div>
      <img [src]="profile.about_image" alt="About Me">
      <div class="glow-effect"></div>
    </div>
    <div class="text" data-aos="fade-left">
      <div class="typing-container">
        <span class="static-text">Hi, I'm</span>
        <span class="typing-text">{{ profile.name }}</span>
      </div>
      <p [innerHTML]="profile.about_text_1"></p>
      <p>{{ profile.about_text_2 }}</p>
      <div class="skills-highlight">
        <span class="badge" *ngFor="let h of highlights">{{ h.name }}</span>
      </div>
      <p class="connect-text" *ngIf="profile.connect_text">
        {{ profile.connect_text }}
      </p>
    </div>
  </div>

  <!-- Timeline Section -->
  <div class="timeline-section" data-aos="fade-up">
    <div class="timeline-tabs">
      <button
        class="tab-btn"
        [class.active]="activeTab === 'edu'"
        (click)="switchTab('edu')">
        <lucide-icon [name]="GraduationCap" size="18"></lucide-icon>
        <span>Pendidikan</span>
      </button>
      <button
        class="tab-btn"
        [class.active]="activeTab === 'work'"
        (click)="switchTab('work')">
        <lucide-icon [name]="Briefcase" size="18"></lucide-icon>
        <span>Pengalaman Kerja</span>
      </button>
    </div>

    <!-- Education -->
    <div class="tab-panel" [class.active]="activeTab === 'edu'">
      <div class="timeline">
        <div class="tl-item" *ngFor="let edu of education">
          <div class="tl-dot"></div>
          <div class="tl-period">{{ edu.period }}</div>
          <div class="tl-title">{{ edu.title }}</div>
          <div class="tl-sub">{{ edu.sub_title }}</div>
        </div>
      </div>
    </div>

    <!-- Work Experience -->
    <div class="tab-panel" [class.active]="activeTab === 'work'">
      <div class="timeline">
        <div class="tl-item" *ngFor="let exp of experiences">
          <div class="tl-dot"></div>
          <div class="tl-period">
            {{ exp.period }}
            <span class="now-badge" *ngIf="exp.is_current">Now</span>
          </div>
          <div class="tl-title">{{ exp.title }}</div>
          <div class="tl-sub">{{ exp.company }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
