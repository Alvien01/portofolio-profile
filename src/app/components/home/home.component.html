<div class="home" *ngIf="profile">
  <!-- Animated Background Orbs -->
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <div class="hero-content">
    <div class="profile-container" data-aos="zoom-in" data-aos-duration="1000">
      <img [src]="profile.profile_image" alt="Alfin Ardiansyah - Fullstack Web Developer Profile" class="profile-img" fetchpriority="high" loading="eager" decoding="async" width="220" height="220" />
    </div>
    
    <div class="typing-wrapper">
      <h1 class="gradient-text hero-typing">Hi, I'm {{ profile.name }}</h1>
    </div>
    
    <p data-aos="fade-up" data-aos-delay="400">
      {{ profile.hero_tagline }}
    </p>

    <div class="button-group" data-aos="fade-up" data-aos-delay="600">
      <button (click)="scrollTo('projects')" class="view-btn sweep-anim" aria-label="Jelajahi Proyek Portofolio Alfin">
        Explore Projects <span class="arrow">&rarr;</span>
      </button>

      <a [href]="profile.resume_url" download class="download-btn" aria-label="Unduh Resume CV Alfin Ardiansyah">
        Get Resume
      </a>
    </div>
  </div>

  <div class="scroll-indicator" (click)="scrollTo('about')" data-aos="fade-in" data-aos-delay="1200">
    <div class="mouse">
      <div class="wheel"></div>
    </div>
  </div>
</div>
