<!-- Login Modal -->
<div class="modal-overlay" *ngIf="showModal" (click)="closeModal()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Login</h2>
      <button class="close-btn" (click)="closeModal()">
        <lucide-icon [name]="X"></lucide-icon>
      </button>
    </div>
    
    <form (ngSubmit)="handleLogin()">
      <div class="form-group">
        <label for="username">Email / Username</label>
        <input 
          type="text" 
          id="username" 
          name="username"
          [(ngModel)]="username"
          required
          placeholder="admin@example.com"
          class="form-control"
        />
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password"
          [(ngModel)]="password"
          required
          placeholder="Enter your password"
          class="form-control"
        />
      </div>

      <div *ngIf="errorMessage" style="color: #fca5a5; font-size: 0.85rem; margin-bottom: 0.75rem; text-align: center;">
        {{ errorMessage }}
      </div>
      
      <div class="modal-actions">
        <button type="button" class="btn-cancel" (click)="closeModal()" [disabled]="isLoading">Cancel</button>
        <button type="submit" class="btn-submit" [disabled]="isLoading">
          <span *ngIf="!isLoading">Login</span>
          <span *ngIf="isLoading">Loading...</span>
        </button>
      </div>
    </form>
  </div>
</div>

<footer class="footer">
  <div class="footer-content">
    <div class="social-links">
      <a href="https://github.com/Alvien01" target="_blank" aria-label="GitHub">
        <lucide-icon [name]="Github"></lucide-icon>
      </a>
      <a href="https://www.linkedin.com/in/alfin-ardiansyah-93150a250/" target="_blank" aria-label="LinkedIn">
        <lucide-icon [name]="Linkedin"></lucide-icon>
      </a>
      <a href="https://instagram.com/" target="_blank" aria-label="Instagram">
        <lucide-icon [name]="Instagram"></lucide-icon>
      </a>
    </div>
    <p>&copy; 2026 Alfin Ardiansyah. Crafted with passion.</p>
    <button class="login-trigger-btn" (click)="openModal()">Login</button>
  </div>
</footer>
